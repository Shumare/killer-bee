version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: killer-bee-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    networks:
      - app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: killer-bee-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge
