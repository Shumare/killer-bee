version: '3.8'

# ── Synchronisation horaire ───────────────────────────────────────────────────
# Les containers partagent l'horloge du daemon Docker host par défaut.
# Prérequis : configurer chrony/ntpd sur l'hôte en pointant vers le serveur NTP
# interne (adresse définie dans NTP_SERVER dans .env).
# La variable TZ contrôle le fuseau horaire affiché dans les logs applicatifs.

services:

  # ── Gateway (Traefik) ─────────────────────────────────────────────────────────
  gateway:
    image: traefik:v3.0
    container_name: killer-bee-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/dynamic:/etc/traefik/dynamic:ro
      - ./gateway/logs:/logs
    networks:
      - app
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      ingredient-service:
        condition: service_healthy
      freezbe-service:
        condition: service_healthy
      process-service:
        condition: service_healthy
      frontend:
        condition: service_started

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: killer-bee-frontend
    networks:
      - app
    restart: unless-stopped

  # ── Auth Service ───────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: killer-bee-auth
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TZ=${TZ:-UTC}
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── User Service ───────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: killer-bee-user
    environment:
      - NODE_ENV=production
      - PORT=3002
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TZ=${TZ:-UTC}
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Ingredient Service ────────────────────────────────────────────────────────
  ingredient-service:
    build:
      context: ./services/ingredient-service
      dockerfile: Dockerfile
    container_name: killer-bee-ingredient
    environment:
      - NODE_ENV=production
      - PORT=3003
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TZ=${TZ:-UTC}
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Freezbe Service ───────────────────────────────────────────────────────────
  freezbe-service:
    build:
      context: ./services/freezbe-service
      dockerfile: Dockerfile
    container_name: killer-bee-freezbe
    environment:
      - NODE_ENV=production
      - PORT=3004
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TZ=${TZ:-UTC}
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Process Service ───────────────────────────────────────────────────────────
  process-service:
    build:
      context: ./services/process-service
      dockerfile: Dockerfile
    container_name: killer-bee-process
    environment:
      - NODE_ENV=production
      - PORT=3005
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - FREEZBE_SERVICE_URL=http://freezbe-service:3004
      - TZ=${TZ:-UTC}
    depends_on:
      freezbe-service:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── SQL Server ────────────────────────────────────────────────────────────────
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: killer-bee-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$SA_PASSWORD' -Q 'SELECT 1' -b -No || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  app:
    driver: bridge

volumes:
  sqlserver-data:
