version: '3.8'

services:

  # ── Gateway (Traefik) ─────────────────────────────────────────────────────────
  gateway:
    image: traefik:v3.0
    container_name: killer-bee-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/dynamic:/etc/traefik/dynamic:ro
      - ./gateway/logs:/logs
    networks:
      - app
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      ingredient-service:
        condition: service_healthy
      freezbe-service:
        condition: service_healthy
      process-service:
        condition: service_healthy
      frontend:
        condition: service_started

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_CIPHER_KEY=${VITE_CIPHER_KEY:-killer-bee-default-key}
    container_name: killer-bee-frontend
    networks:
      - app
    restart: unless-stopped

  # ── Auth Service ───────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: killer-bee-auth
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TZ=${TZ:-UTC}
      - CIPHER_KEY=${CIPHER_KEY:-killer-bee-default-key}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-killer_bee}
      - DB_USER=${DB_USER:-LOGIN_APP}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── User Service ───────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: killer-bee-user
    environment:
      - NODE_ENV=production
      - PORT=3002
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TZ=${TZ:-UTC}
      - CIPHER_KEY=${CIPHER_KEY:-killer-bee-default-key}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-killer_bee}
      - DB_USER=${DB_USER:-LOGIN_APP}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Ingredient Service ────────────────────────────────────────────────────────
  ingredient-service:
    build:
      context: ./services/ingredient-service
      dockerfile: Dockerfile
    container_name: killer-bee-ingredient
    environment:
      - NODE_ENV=production
      - PORT=3003
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TZ=${TZ:-UTC}
      - CIPHER_KEY=${CIPHER_KEY:-killer-bee-default-key}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-killer_bee}
      - DB_USER=${DB_USER:-LOGIN_APP}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Freezbe Service ───────────────────────────────────────────────────────────
  freezbe-service:
    build:
      context: ./services/freezbe-service
      dockerfile: Dockerfile
    container_name: killer-bee-freezbe
    environment:
      - NODE_ENV=production
      - PORT=3004
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TZ=${TZ:-UTC}
      - CIPHER_KEY=${CIPHER_KEY:-killer-bee-default-key}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-killer_bee}
      - DB_USER=${DB_USER:-LOGIN_APP}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Process Service ───────────────────────────────────────────────────────────
  process-service:
    build:
      context: ./services/process-service
      dockerfile: Dockerfile
    container_name: killer-bee-process
    environment:
      - NODE_ENV=production
      - PORT=3005
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TZ=${TZ:-UTC}
      - CIPHER_KEY=${CIPHER_KEY:-killer-bee-default-key}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-killer_bee}
      - DB_USER=${DB_USER:-LOGIN_APP}
      - DB_PASSWORD=${DB_PASSWORD}
      - FREEZBE_SERVICE_URL=http://freezbe-service:3004
    depends_on:
      freezbe-service:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  app:
    driver: bridge
