version: '3.9'

networks:
  killerbee-net:
    driver: bridge

volumes:
  sqlserver-data:
  traefik-acme:

services:
  # ─── SQL Server ────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: killerbee-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD:-KillerBee@2024!}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - killerbee-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD:-KillerBee@2024!}' -Q 'SELECT 1'"]
      interval: 15s
      retries: 10
      timeout: 5s

  # ─── Traefik API Gateway ────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: killerbee-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/acme
    networks:
      - killerbee-net
    depends_on:
      - sqlserver

  # ─── Auth Service ───────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: apps/services/auth-service/Dockerfile
    container_name: killerbee-auth
    environment:
      AUTH_PORT: "3001"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD:-KillerBee@2024!}"
      DB_NAME: killerbee
      JWT_SECRET: "${JWT_SECRET:-supersecretjwt_change_in_prod}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-supersecretrefresh_change_in_prod}"
      NODE_ENV: production
    networks:
      - killerbee-net
    depends_on:
      sqlserver:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Model Service ──────────────────────────────────────────
  model-service:
    build:
      context: .
      dockerfile: apps/services/model-service/Dockerfile
    container_name: killerbee-model
    environment:
      MODEL_PORT: "3002"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD:-KillerBee@2024!}"
      DB_NAME: killerbee
      JWT_SECRET: "${JWT_SECRET:-supersecretjwt_change_in_prod}"
      CRYPTO_KEY_SUB1: "${CRYPTO_KEY_SUB1:-3}"
      CRYPTO_KEY_SUB2: "${CRYPTO_KEY_SUB2:-KILLERBEE}"
      CRYPTO_KEY_TRANSPOSITION: "${CRYPTO_KEY_TRANSPOSITION:-SECRET}"
      NODE_ENV: production
    networks:
      - killerbee-net
    depends_on:
      sqlserver:
        condition: service_healthy
    labels:
      - "traefik.enable=false"

  # ─── Ingredient Service ─────────────────────────────────────
  ingredient-service:
    build:
      context: .
      dockerfile: apps/services/ingredient-service/Dockerfile
    container_name: killerbee-ingredient
    environment:
      INGREDIENT_PORT: "3003"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD:-KillerBee@2024!}"
      DB_NAME: killerbee
      JWT_SECRET: "${JWT_SECRET:-supersecretjwt_change_in_prod}"
      NODE_ENV: production
    networks:
      - killerbee-net
    depends_on:
      sqlserver:
        condition: service_healthy
    labels:
      - "traefik.enable=false"

  # ─── Process Service ────────────────────────────────────────
  process-service:
    build:
      context: .
      dockerfile: apps/services/process-service/Dockerfile
    container_name: killerbee-process
    environment:
      PROCESS_PORT: "3004"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD:-KillerBee@2024!}"
      DB_NAME: killerbee
      JWT_SECRET: "${JWT_SECRET:-supersecretjwt_change_in_prod}"
      NODE_ENV: production
    networks:
      - killerbee-net
    depends_on:
      sqlserver:
        condition: service_healthy
    labels:
      - "traefik.enable=false"

  # ─── Test Service ───────────────────────────────────────────
  test-service:
    build:
      context: .
      dockerfile: apps/services/test-service/Dockerfile
    container_name: killerbee-test
    environment:
      TEST_PORT: "3005"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD:-KillerBee@2024!}"
      DB_NAME: killerbee
      JWT_SECRET: "${JWT_SECRET:-supersecretjwt_change_in_prod}"
      NODE_ENV: production
    networks:
      - killerbee-net
    depends_on:
      sqlserver:
        condition: service_healthy
    labels:
      - "traefik.enable=false"

  # ─── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: killerbee-frontend
    networks:
      - killerbee-net
    labels:
      - "traefik.enable=false"

  # ─── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: killerbee-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - killerbee-net

  # ─── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.3
    container_name: killerbee-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - killerbee-net
    depends_on:
      - prometheus
