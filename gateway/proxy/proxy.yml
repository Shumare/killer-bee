http:
  services:
    vm-pool:
      loadBalancer:
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"
        servers:
          - url: "http://backend-vm1:3001"
            weight: 1
          - url: "http://backend-vm2:3002"
            weight: 1
        sticky:
          cookie:
            name: lb_session
            secure: true
            httpOnly: true
