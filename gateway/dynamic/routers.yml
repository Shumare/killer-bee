http:
  routers:
    auth-router:
      rule: "PathPrefix(`/api/auth`)"
      service: auth-service
      middlewares:
        - rate-limit
        - secure-headers
      entryPoints:
        - web

    user-router:
      rule: "PathPrefix(`/api/users`)"
      service: user-service
      middlewares:
        - rate-limit
        - secure-headers
      entryPoints:
        - web

    ingredient-router:
      rule: "PathPrefix(`/api/ingredients`)"
      service: ingredient-service
      middlewares:
        - rate-limit
        - secure-headers
      entryPoints:
        - web

    freezbe-router:
      rule: "PathPrefix(`/api/freezbe`)"
      service: freezbe-service
      middlewares:
        - rate-limit
        - secure-headers
      entryPoints:
        - web

    process-router:
      rule: "PathPrefix(`/api/processes`)"
      service: process-service
      middlewares:
        - rate-limit
        - secure-headers
      entryPoints:
        - web

    frontend-router:
      rule: "PathPrefix(`/`)"
      service: frontend
      middlewares:
        - secure-headers
        - compress
      entryPoints:
        - web
