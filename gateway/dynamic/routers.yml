http:
  routers:
    api-router:
      rule: "PathPrefix(`/api`)"
      service: backend
      middlewares:
        - rate-limit
        - secure-headers
      entryPoints:
        - websecure
      tls: {}

    frontend-router:
      rule: "PathPrefix(`/`)"
      service: frontend
      middlewares:
        - secure-headers
        - compress
      entryPoints:
        - websecure
      tls: {}
