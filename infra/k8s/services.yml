---
# ─── Auth Service ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: killerbee
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/killerbee/auth-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: AUTH_PORT
              value: "3001"
            - name: DB_HOST
              value: sqlserver
            - name: DB_PORT
              value: "1433"
            - name: DB_USER
              value: sa
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: killerbee-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              value: killerbee
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: killerbee-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: killerbee-secrets
                  key: JWT_REFRESH_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: killerbee
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
---
