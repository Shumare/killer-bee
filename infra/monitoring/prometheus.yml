global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: '/metrics'

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'

  - job_name: 'model-service'
    static_configs:
      - targets: ['model-service:3002']
    metrics_path: '/metrics'

  - job_name: 'ingredient-service'
    static_configs:
      - targets: ['ingredient-service:3003']
    metrics_path: '/metrics'

  - job_name: 'process-service'
    static_configs:
      - targets: ['process-service:3004']
    metrics_path: '/metrics'

  - job_name: 'test-service'
    static_configs:
      - targets: ['test-service:3005']
    metrics_path: '/metrics'
